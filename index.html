<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubTracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Section 1: Game Clock -->
        <section id="clock-section">
            <div class="clock-display">
                <div id="stopwatch">00:00</div>
                <div id="shortest-stint">--:--</div>
            </div>
            <div class="clock-controls">
                <button id="toggle-btn" class="btn-primary">Start</button>
                <button id="rewind-btn" class="btn-secondary">↺ -30s</button>
                <button id="fast-forward-btn" class="btn-secondary">↻ +30s</button>
            </div>
        </section>

        <!-- Section 2: On Field -->
        <section id="on-field-section">
            <h2>On Field</h2>
            <div class="player-list-container on-field-grid">
                <div id="on-field-header" class="player-card list-header hidden">
                    <span class="col-label">Name</span>
                    <span class="col-label">Pos</span>
                    <span class="col-label">Total</span>
                    <span class="col-label">Stint</span>
                    <span class="col-label"></span>
                </div>
                <div id="on-field-list" class="player-list">
                    <!-- Players will be injected here -->
                </div>
            </div>
        </section>

        <!-- Position Selection Modal -->
        <dialog id="position-dialog">
            <h3>Select Position</h3>
            <div id="position-options"></div>
            <button id="close-dialog" class="btn-link">Cancel</button>
        </dialog>

        <!-- Section 3: Bench -->
        <section id="bench-section">
            <h2>Bench</h2>
            <div class="player-list-container bench-grid">
                <div id="bench-header" class="player-card list-header hidden">
                    <span class="col-label">Name</span>
                    <span class="col-label">Total</span>
                    <span class="col-label">Bench</span>
                    <span class="col-label"></span>
                </div>
                <div id="bench-list" class="player-list">
                    <!-- Players will be injected here -->
                </div>
            </div>
        </section>

        <!-- Section 3.5: Substitution Plan -->
        <section id="plan-section">
            <div id="plan-header" class="plan-header">
                <div class="plan-header-title">
                    <span id="plan-toggle-icon" class="plan-toggle-icon">▶</span>
                    <h2>Substitution Plan</h2>
                </div>
                <span id="plan-badge" class="plan-badge hidden">0 moves</span>
            </div>
            <div id="plan-content" class="plan-content hidden">
                <div class="plan-columns-header">
                    <span class="plan-col-title">Current</span>
                    <span class="plan-col-spacer"></span>
                    <span class="plan-col-title">Planned (Drag to adjust)</span>
                </div>
                <div id="plan-grid-wrapper" class="plan-grid-wrapper">
                    <svg id="plan-arrows-svg" class="plan-arrows-svg">
                        <defs>
                            <marker id="arrow-defense" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2980b9"/>
                            </marker>
                            <marker id="arrow-midfield" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#27ae60"/>
                            </marker>
                            <marker id="arrow-offense" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c0392b"/>
                            </marker>
                            <marker id="arrow-goalie" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f39c12"/>
                            </marker>
                            <marker id="arrow-bench" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#e74c3c"/>
                            </marker>
                            <marker id="arrow-unassigned" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                                <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2ecc71"/>
                            </marker>
                        </defs>
                    </svg>
                    <div id="plan-grid" class="plan-grid">
                        <!-- Dynamic position rows injected here -->
                    </div>
                </div>
                <div class="plan-controls">
                    <button id="plan-execute-btn" class="btn-execute">▶ Execute Subs</button>
                    <button id="plan-reset-btn" class="btn-secondary">↺ Auto-Rotate</button>
                    <button id="plan-clear-btn" class="btn-link">Clear</button>
                </div>
            </div>
        </section>

        <!-- Section 4: Settings & Admin -->
        <section id="admin-section">
            <button id="admin-toggle" class="btn-link">⚙ Settings</button>
            <div id="admin-content" class="hidden">
                <h3>Roster Management</h3>
                <div class="add-player">
                    <input type="text" id="player-name" placeholder="Player Name">
                    <button id="add-btn" class="btn-success">Add</button>
                </div>
                <ul id="roster-list"></ul>
                <hr>
                <button id="reset-btn" class="btn-danger">Reset Game Session</button>
                <p class="hint">Resets all times. Roster is kept.</p>
            </div>
        </section>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
